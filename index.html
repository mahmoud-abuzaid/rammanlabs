<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Romman Labs - حلول رقمية نطورها بشغف لتكون جزءاً من تطور الأعمال والمجتمع" />
    <meta name="theme-color" content="#030712" />
    <title>Romman Labs · ننطلق قريباً</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>


    <!-- Static Aurora Background -->
    <div class="aurora-bg"></div>
    <div class="aurora-overlay"></div>

    <!-- Interactive Spotlight Grid -->
    <div id="spotlight-grid"></div>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="theme-toggle" aria-label="تبديل المظهر">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <main class="hero fade-in-up">
        <!-- Centered Logo with Fallback -->
        <div class="hero-logo">
            <img src="logo.png" alt="Romman Labs Logo" id="main-logo" decoding="async" loading="eager" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
            <h2 id="logo-fallback" style="display: none; font-size: 32px; font-weight: 900; letter-spacing: 1px; color: var(--text-color); margin: 0;">Romman<span class="text-primary">Labs</span></h2>
        </div>

        <div class="hero-content">
            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span>ننطلق قريباً</span>
            </div>

            <h1>نبني اليوم<br><span class="text-primary">لنؤثر في الغد.</span></h1>

            <!-- Rotating Text Container -->
            <div class="rotating-text-container">
                <span class="static-text">نطور منصات ذكية لدعم</span>
                <span id="dynamic-text" class="dynamic-text"></span>
            </div>
        </div>
    </main>

    <footer class="fade-in-up delay-1">
        <p>© 2026 رمان لابز. جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
