<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Romman Labs · ننطلق قريباً</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               RESET & BASE
            ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #FFFFFF;
            color: #0B1A2E;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        a {
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* ============================================================
               HERO · شعار كبير في المنتصف
            ============================================================ */
        .hero {
            max-width: 700px;
            width: 100%;
        }

        /* حاوية الشعار بخلفية بيضاء ونظيفة */
        .logo-wrapper {
            background: #ffffff;
            display: inline-block;
            padding: 10px;
            margin-bottom: 35px;
        }

        .logo-wrapper img {
            display: block;
            width: 420px;
            /* حجم كبير جداً */
            max-width: 90vw;
            height: auto;
        }

        /* شارة بسيطة بدون أيقونات */
        .status-badge {
            display: inline-block;
            background: #FFEBEE;
            color: #C62828;
            font-weight: 800;
            font-size: 15px;
            padding: 6px 28px;
            border-radius: 40px;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
            border: 1px solid rgba(198, 40, 40, 0.08);
        }

        h1 {
            font-size: 38px;
            font-weight: 900;
            color: #0B1A2E;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        h1 span {
            color: #C62828;
        }

        p {
            font-size: 18px;
            color: #4A5568;
            max-width: 480px;
            margin: 0 auto 36px;
            line-height: 1.8;
        }

        .btn-contact {
            background: #0B1A2E;
            color: #FFFFFF;
            padding: 14px 44px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            display: inline-block;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .btn-contact:hover {
            background: #C62828;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(198, 40, 40, 0.25);
        }

        /* ============================================================
               FOOTER
            ============================================================ */
        footer {
            margin-top: 60px;
            color: #9AA0A8;
            font-size: 14px;
            border-top: 1px solid #F0F0F0;
            padding-top: 28px;
            width: 100%;
            max-width: 700px;
        }

        footer span {
            color: #C62828;
            font-weight: 700;
        }

        /* ============================================================
               RESPONSIVE
            ============================================================ */
        @media (max-width: 600px) {
            .logo-wrapper img {
                width: 280px;
            }
            h1 {
                font-size: 30px;
            }
            p {
                font-size: 16px;
                padding: 0 10px;
            }
            .btn-contact {
                padding: 12px 32px;
                font-size: 14px;
            }
            .status-badge {
                font-size: 13px;
                padding: 5px 20px;
            }
        }

        @media (max-width: 400px) {
            .logo-wrapper img {
                width: 200px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    المحتوى الرئيسي
    ============================================================ -->
    <section class="hero">

        <!-- الشعار في المنتصف وكبير -->
        <div class="logo-wrapper">
            <img src="logo.png" alt="Romman Labs" />
        </div>


        <h1>
            نبني اليوم<br />
            <span>لنؤثر في الغد</span>
        </h1>

        <p>
            حلول رقمية نطورها بشغف،<br />
            لتكون جزءاً من تطور الأعمال والمجتمع.
        </p>

        <a href="#" class="btn-contact">تواصل معنا</a>

    </section>

    <!-- ============================================================
    التذييل
    ============================================================ -->
    <footer>
        <p>© 2026 <span>رمان لابز</span> · جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
